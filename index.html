<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mywotb">
<title>mywotb · Blitz Observatory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="topbar">
  <div class="brand" id="brand" title="mywotb">
    <span class="brand-mark">W</span>
    <span class="brand-name">my<span>wotb</span></span>
    <span class="brand-sub">Blitz Observatory</span>
  </div>

  <div class="search-island">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.35-4.35"/></svg>
    <input id="player-search" type="search" placeholder="Нікнейм гравця · EU" autocomplete="off" spellcheck="false">
    <button id="search-btn" class="search-go" type="button" title="Знайти">↵</button>
    <div id="search-results" class="search-results hidden"></div>
  </div>

  <div class="header-right">
    <span class="region-chip"><i></i> Європа · EU</span>
    <button id="install-btn" class="icon-btn hidden" type="button" title="Встановити PWA">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    </button>
    <button id="refresh-btn" class="icon-btn" type="button" title="Оновити дані">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button id="auth-btn" class="auth-chip" type="button" title="Синхронізація сесій">Увійти</button>
    <span id="header-avatar" class="header-avatar" title="Гравець не обрано">—</span>
  </div>
</header>

<div class="tabbar-wrap">
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="profile" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v2"/></svg>
      <span>Профіль</span>
    </button>
    <button class="tab" data-tab="sessions" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Сесії</span>
      <span class="tab-count" id="session-count">0</span>
    </button>
  </nav>
</div>

<main id="main">
  <section class="view" id="view-profile" data-view="profile"></section>
  <section class="view hidden" id="view-sessions" data-view="sessions"></section>
</main>

<footer class="site-footer">
  <span>mywotb · макет</span>
  <span>Дані: Wargaming Blitz API · регіон EU · без WN7 / WN8 / WTR</span>
</footer>

<!-- Акаунт / синхронізація сесій -->
<div id="auth-modal" class="modal-backdrop hidden">
  <div class="modal-card">
    <button id="auth-close" class="modal-close" type="button" title="Закрити">✕</button>
    <div class="modal-glyph">☁</div>
    <h2 id="auth-title">Вхід до акаунта</h2>
    <p class="modal-sub">Сесії синхронізуються через Supabase. Без входу вони зберігаються лише в цьому браузері.</p>
    <input id="auth-email" class="modal-input" type="email" placeholder="Email" autocomplete="email">
    <input id="auth-username" class="modal-input hidden" type="text" placeholder="Ім'я користувача">
    <input id="auth-password" class="modal-input" type="password" placeholder="Пароль" autocomplete="current-password">
    <div id="auth-error" class="auth-error"></div>
    <div class="modal-actions">
      <button id="auth-submit" class="btn-primary" type="button">Увійти</button>
      <button id="auth-switch" class="btn-ghost" type="button">Реєстрація</button>
      <button id="auth-sync" class="btn-ghost hidden" type="button">⟳ Синхронізувати</button>
      <button id="auth-logout" class="btn-ghost btn-danger hidden" type="button">Вийти</button>
    </div>
    <div id="auth-status" class="auth-status">Хмара не підключена</div>
  </div>
</div>

<div id="toast-host" class="toast-host" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
